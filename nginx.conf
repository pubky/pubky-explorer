server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location = /testnet {
        return 308 /testnet/$is_args$args;
    }

    location /testnet/assets/ {
        try_files $uri =404;
    }

    location /testnet/ {
        try_files $uri $uri/ /testnet/index.html;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
